<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}A Good Fit{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700&family=Inter+Tight:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F4EFE7;color:#31391B;font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:400px;margin:0 auto;padding:56px 28px}
  h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.01em;color:#6B7F3C;margin:0}
  p{font-size:14px;line-height:1.45;color:#6E6A5C;margin:6px 0 22px}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  input{width:100%;box-sizing:border-box;height:50px;padding:0 16px;border-radius:12px;border:1px solid #D9D4C8;background:#fff;font:16px "Inter Tight",system-ui,sans-serif;color:#31391B;margin-bottom:14px}
  input:focus{outline:none;border-color:#6B7F3C;box-shadow:0 0 0 3px rgba(107,127,60,.18)}
  button{width:100%;height:52px;border:none;border-radius:12px;background:#6B7F3C;color:#fff;font:600 16px "Inter Tight",system-ui,sans-serif;cursor:pointer;margin-top:8px}
  .err{color:#A8392C;font-size:13px;font-weight:600;margin:-8px 0 12px}
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>

# A Good Fit API stack. Everything lives under AGF_ROOT (default
# /opt/agoodfit); nothing is installed in the server's root folders.
#
# Only nginx publishes a port, and only on 127.0.0.1, so it never clashes
# with other apps on the server. The server's shared web server (Caddy or
# nginx, set up by server-setup.sh) terminates HTTPS and forwards here.

name: agoodfit

# Every container gets a memory cap and capped logs, so this app can't crowd
# out other apps on the same server. Total here: about 1.5 GB.
x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging: *logs
    environment:
      POSTGRES_DB: ${DB_NAME:-agoodfit}
      POSTGRES_USER: ${DB_USER:-agoodfit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    volumes:
      - ${AGF_ROOT:-/opt/agoodfit}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 160m
    logging: *logs
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  web:
    build:
      context: ..
    image: agoodfit-api:latest
    restart: unless-stopped
    mem_limit: 800m
    logging: *logs
    env_file: ${AGF_ROOT:-/opt/agoodfit}/.env
    environment:
      DJANGO_SETTINGS_MODULE: goodfit_api.settings.production
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ${AGF_ROOT:-/opt/agoodfit}/data/media:/app/media
      - ${AGF_ROOT:-/opt/agoodfit}/data/logs:/app/logs
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging: *logs
    ports:
      - "127.0.0.1:${AGF_PORT:-8010}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AGF_ROOT:-/opt/agoodfit}/data/media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - web

volumes:
  static:

# Inside the stack: serves uploaded media and static files, forwards the rest
# to gunicorn. HTTPS is handled by the server's shared web server in front.

upstream agf_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Photos from the app (activities, chats, avatars).
    client_max_body_size 25m;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # Test builds of the member app (/download/): served as Android packages.
    location /media/downloads/ {
        alias /srv/media/downloads/;
        types { application/vnd.android.package-archive apk; application/json json; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://agf_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass on the scheme the front web server saw (https).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

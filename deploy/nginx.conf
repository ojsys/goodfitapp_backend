# Inside the stack: serves uploaded media and static files, forwards the rest
# to gunicorn. HTTPS is handled by the server's shared web server in front.

# Map tiles for the app, fetched from OpenStreetMap once and cached here, so
# the app never talks to the tile server directly and never ships a key.
# (OSM tile policy: identify the app, cache, no bulk downloading.)
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=4g inactive=60d use_temp_path=off;

upstream agf_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Photos from the app (activities, chats, avatars).
    client_max_body_size 25m;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # Test builds of the member app (/download/): served as Android packages.
    location /media/downloads/ {
        alias /srv/media/downloads/;
        types { application/vnd.android.package-archive apk; application/octet-stream ipa; application/json json; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # /tiles/{z}/{x}/{y}.png  (z up to 19)
    location ~ "^/tiles/(1?[0-9])/([0-9]{1,6})/([0-9]{1,6})\.png$" {
        proxy_pass https://tile.openstreetmap.org/$1/$2/$3.png;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "AGoodFit/1.0 (+https://api.getlovelly.cloud/download/)";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_cache tiles;
        proxy_cache_key $uri;
        proxy_cache_valid 200 14d;
        proxy_cache_valid 404 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_429;
        proxy_cache_background_update on;
        add_header X-Tile-Cache $upstream_cache_status;
        add_header Access-Control-Allow-Origin "*";
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://agf_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass on the scheme the front web server saw (https).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
